<!doctype html>
<html lang="ja">

<title>きくまど（本物の AI 版）｜保護者のための AI 相談窓口</title>

<script>
/* ==========================================================================
   ここから「設定」と「学校の情報」と「色」です。
   言葉や色を変えたいときは、この部分だけを書きかえてください。

   【言葉の変え方】
   ・` ` （バッククォート）で囲まれた中の文字を、自由に書きかえてください
   ・改行したいところは、そのまま Enter で改行すれば OK です
   ・` や { } [ ] , は消さないように注意してください

   【AI について】
   ・Google の Gemini を使います。最初に開いたとき、API キーを入れる欄が出ます
   ・API キーは、このパソコンのブラウザの中だけに保存されます（このファイルには書かれません）
   ・無料枠では、入力した内容が Google のサービス改善に使われることがあります
     実在の人の名前や、本当の相談内容は入れないでください
   ========================================================================== */

const 設定 = {
  窓口の名前: `きくまど`,
  ひとこと説明: `保護者のための AI 相談窓口`,
  学校の名前: `あおぞら市立 第一中学校`,
  受付時間: `24時間受付`,

  // 最初に AI が言うあいさつ
  あいさつ: `こんにちは、きくまどです。
学校へのご質問やご相談を、24時間お聞きします。どんなことでしょうか？`,

  // まとめのカード
  まとめの見出し: `先生へのまとめ（送る前のご確認）`,
  送るボタン: `この内容で送る`,
  直すボタン: `直したい`,
  送ったあとの表示: `送信しました`,

  // 送ったあとに出るお知らせと、AI の返事
  届け先_緊急: `担任・生徒指導担当の先生に届けました（緊急度「高」のため優先）`,
  届け先_ふつう: `担任の先生に届けました`,
  送ったあとの返事_緊急: `お送りしました。学校から優先してご連絡します。`,
  送ったあとの返事_ふつう: `お送りしました。内容を確認のうえ、学校からご連絡します。`,
  緊急のときの案内: `お子さんの身に危険を感じるときや、今すぐ誰かに話したいときは、学校へお電話いただくか、「24時間子供SOSダイヤル」（0120-0-78310）もご利用ください。`,

  // AI が答えだけで済ませたときのお知らせ
  回答済みのお知らせ: `AI が回答しました ・ 先生への連絡はありません`,

  // 使う AI のモデル（ふつうは変えなくて OK）
  モデル: `gemini-3.6-flash`,
};

// AI が「簡単な質問」に答えるときに使う情報です
// ここに無いことは、AI は答えずに先生へ回します
const 学校の情報 = `
- 運動会: 11月21日（土）。雨で延期するときは、当日の朝6時までに、学校からのメールとホームページでお知らせする。延期した場合は次の日（11月22日）に行う。
- 運動会の持ち物: 体操服、帽子、水筒、タオル。給食があるので、お弁当はいらない。
- 欠席・遅刻の連絡: 当日の朝8時までに、学校からのメールにある「欠席連絡フォーム」から送る。電話でもよい。
- 給食費: 毎月10日に、登録した口座から引き落とし。
- 個人面談: 12月1日（月）〜5日（金）。日程の希望は、11月20日までに学校からのメールで出す。
- スクールカウンセラー: 毎週水曜日に学校に来る。相談の予約は担任の先生へ。
- 冬休み: 12月25日（木）〜1月7日（水）。
`;

// 色は「#」から始まる 6 けたの記号で書きます（例: #3949ab）
const 色 = {
  メインの色: `#3949ab`,          // 上の帯・保護者の吹き出し・ボタン
  メインの色の上の文字: `#ffffff`, // メインの色の上に乗る文字
  会話の背景: `#eef1f8`,          // 会話の後ろ
  AIの吹き出し: `#ffffff`,        // AI の吹き出し
  文字の色: `#1a1d29`,            // ふつうの文字
  緊急度_高: `#c62828`,           // 緊急度「高」の札（赤）
  緊急度_中: `#a75400`,           // 緊急度「中」の札（オレンジ）
  緊急度_低: `#2e7d32`,           // 緊急度「低」の札（緑）
  外側の背景: `#dfe3ec`,          // スマホの外側（パソコンで見たとき）
};
/* ==========================================================================
   設定はここまで。ここから下は、画面と AI を動かす仕組みです。
   ========================================================================== */
</script>

<style>

    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-0.35em); }
  }

  /* 選択肢 */
  .chips { display: flex; flex-wrap: wrap; gap: 0.5em; }
  .chip {
    min-height: 2.75em;

  .chip:active, .btn:active { transform: scale(0.94); }
  .chips.done .chip { border-color: #9aa1b5; color: #5a6175; cursor: default; }
  .chips.done .chip:active { transform: none; }
  .chips .chip.selected { border-color: var(--main); background: var(--main); color: var(--on-main); }

  /* まとめのカード */
  .card {

  .card-head svg { width: 1.125em; height: 1.125em; fill: currentColor; flex: none; }

  .card-actions { display: flex; flex-direction: column; gap: 0.5em; padding: 0.25em 0.875em 0.875em; }
  .btn {
    min-height: 2.75em;

  }

  }
  .sent svg { width: 1.125em; height: 1.125em; fill: currentColor; }

  /* お知らせ */
  .notice {

  :focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }

  /* 出てくるときの動き */

  }
</style>

<div class="phone">

<script>
(() => {
  const アイコン = {
    チェック: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.2 14.6L6.4 12.2l1.6-1.6 2.8 2.8 5.2-5.2 1.6 1.6-6.8 6.8z"/></svg>`,
    注意: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`,
    メモ: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2zm8 1.5V8h4.5L14 3.5zM7 12v2h10v-2H7zm0 4v2h7v-2H7z"/></svg>`,
  };

  // 色を画面に反映する
  const 色の対応 = {
    メインの色: "--main",
    メインの色の上の文字: "--on-main",
    会話の背景: "--chat-bg",
    AIの吹き出し: "--ai-bubble",
    文字の色: "--text",
    緊急度_高: "--urgent-high",
    緊急度_中: "--urgent-mid",
    緊急度_低: "--urgent-low",
    外側の背景: "--page-bg",
  };
  for (const [名前, 変数] of Object.entries(色の対応)) {
    if (色[名前]) document.documentElement.style.setProperty(変数, 色[名前]);
  }

  document.getElementById("headerName").textContent = 設定.窓口の名前;
  document.getElementById("headerSub").textContent = 設定.ひとこと説明;
  document.getElementById("schoolName").textContent = 設定.学校の名前;
  document.getElementById("hours").textContent = 設定.受付時間;

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const composer = document.getElementById("composer");
  const clock = document.getElementById("clock");
  const panel = document.getElementById("panel");
  const keyState = document.getElementById("keyState");

  // ---- API キーの保存（このブラウザの中だけ） ----

  const 鍵の保存場所 = "kikumado.geminiApiKey";
  let 鍵の控え = "";
  const 鍵 = {
    読む() {
      try { return localStorage.getItem(鍵の保存場所) || 鍵の控え; } catch { return 鍵の控え; }
    },
    書く(v) {
      鍵の控え = v;
      try { v ? localStorage.setItem(鍵の保存場所, v) : localStorage.removeItem(鍵の保存場所); } catch {}
      鍵の状態を表示();
    },
  };
  function 鍵の状態を表示() {
    keyState.textContent = 鍵.読む() ? "API キー: 設定済み ✓" : "API キー: まだ入っていません";
  }

  // ---- 時計と日付 ----

  const 曜日 = ["日", "月", "火", "水", "木", "金", "土"];
  function 時刻を更新() {
    const d = new Date();
    clock.textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function 今日() {
    const d = new Date();
    return `${d.getMonth() + 1}月${d.getDate()}日（${曜日[d.getDay()]}）`;
  }
  時刻を更新();
  setInterval(時刻を更新, 30 * 1000);

  // ---- 部品を足す ----

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function 下まで送る(なめらか) {
    const last = chat.lastElementChild;
    // まとめのカードが出た直後（送る前）は、カードの頭から見せる
    const カードの頭 = last?.classList.contains("wide") && last.querySelector(".card-actions");
    const top = カードの頭 ? last.offsetTop - 8 : chat.scrollHeight;
    chat.scrollTo({ top, behavior: なめらか ? "smooth" : "auto" });
  }

  function AIの行(広い) {
    const 続き = chat.lastElementChild?.classList.contains("ai");
    const row = el("div", "row ai appear" + (続き ? " cont" : "") + (広い ? " wide" : ""));
    row.append(el("div", "avatar", "AI"));
    const body = el("div", "body");
    if (!続き) body.append(el("div", "name", 設定.窓口の名前));
    row.append(body);
    chat.append(row);
    return body;
  }

  function AIの発言(text, 選択肢) {
    const body = AIの行(false);
    body.append(el("div", "bubble", text));
    if (選択肢?.length) {
      const chips = el("div", "chips");
      for (const c of 選択肢) {
        const b = el("button", "chip", c);
        b.type = "button";
        b.addEventListener("click", () => {
          if (chips.classList.contains("done") || 待ち中) return;
          b.classList.add("selected");
          送る(c);
        });
        chips.append(b);
      }
      body.append(chips);
    }
    下まで送る(true);
  }

  function 入力中の表示() {
    const body = AIの行(false);
    const bubble = el("div", "bubble typing");
    bubble.setAttribute("aria-label", "AI が返事を書いています");
    bubble.innerHTML = "<span></span><span></span><span></span>";
    body.append(bubble);
    下まで送る(true);
    return body.parentElement;
  }

  function 保護者の発言(text) {
    const row = el("div", "row parent appear");
    row.append(el("div", "bubble", text));
    chat.append(row);
    下まで送る(true);
    return row;
  }

  function お知らせ(text, エラー) {
    const n = el("div", "notice appear" + (エラー ? " error" : ""));
    n.innerHTML = エラー ? アイコン.注意 : アイコン.チェック;
    n.append(el("span", null, text));
    chat.append(n);
    下まで送る(true);
  }

  const まとめの項目 = [
    ["grade", "学年"],
    ["category", "分類"],
    ["urgency", "緊急度"],
    ["summary", "要約"],
    ["request", "希望"],
  ];

  function まとめのカード(まとめ) {
    const body = AIの行(true);
    const card = el("div", "card");
    const head = el("div", "card-head");
    head.innerHTML = アイコン.メモ;
    head.append(el("span", null, 設定.まとめの見出し));
    card.append(head);

    const dl = el("dl");
    for (const [key, 項目] of まとめの項目) {
      const 値 = まとめ[key] || "（なし）";
      const r = el("div", "card-row");
      r.append(el("dt", null, 項目));
      const dd = el("dd");
      const 札 = { 高: "high", 中: "mid", 低: "low" }[値];
      if (key === "urgency" && 札) dd.append(el("span", "badge " + 札, 値));
      else dd.textContent = 値;
      r.append(dd);
      dl.append(r);
    }
    card.append(dl);

    const actions = el("div", "card-actions");
    const 送るボタン = el("button", "btn primary", 設定.送るボタン);
    const 直すボタン = el("button", "btn secondary", 設定.直すボタン);
    送るボタン.type = 直すボタン.type = "button";
    送るボタン.addEventListener("click", () => {
      if (待ち中 || !actions.isConnected) return;
      const done = el("div", "sent");
      done.innerHTML = アイコン.チェック;
      done.append(el("span", null, 設定.送ったあとの表示));
      actions.replaceWith(done);
      まとめを送った(まとめ);
    });
    直すボタン.addEventListener("click", () => {
      if (待ち中 || !actions.isConnected) return;
      actions.remove();
      送る("まとめの内容を直したいです。");
    });
    actions.append(送るボタン, 直すボタン);
    card.append(actions);
    body.append(card);
    下まで送る(true);
  }

  // ---- API キーを入れるカード ----

  function 鍵のカード() {
    const body = AIの行(true);
    const card = el("form", "key-card");
    card.innerHTML = `
      <h2>はじめに：Gemini の API キーを入れてください</h2>
      <p>本物の AI（Google の Gemini）とお話しするための鍵です。</p>
      <ol>
        <li>Google AI Studio（aistudio.google.com）を開く</li>
        <li>「Get API key」から API キーを作る</li>
        <li>できたキーをコピーして、下に貼り付ける</li>
      </ol>
      <p>キーはこのパソコンのブラウザの中だけに保存されます。無料枠では、入力した内容が Google のサービス改善に使われることがあるため、実在の人の情報は入れないでください。</p>
      <label for="keyInput">API キー</label>
      <input id="keyInput" type="password" autocomplete="off" spellcheck="false">
      <div class="field-error" hidden></div>
      <button class="btn primary" type="submit">保存して始める</button>
    `;
    card.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = card.querySelector("input").value.trim();
      const err = card.querySelector(".field-error");
      if (!v) {
        err.textContent = "API キーを貼り付けてください。";
        err.hidden = false;
        return;
      }
      鍵.書く(v);
      会話を始める();
    });
    body.append(card);
    card.querySelector("input").focus();
  }

  // ---- AI とのやり取り ----

  // AI に毎回返してもらう形
  const 返事の形 = {
    type: "object",
    properties: {
      reply: { type: "string", description: "保護者に見せる返事" },
      choices: {
        type: "array",
        items: { type: "string" },
        description: "保護者が選んで答えられる候補。自由に話してほしいときは空",
      },
      status: {
        type: "string",
        enum: ["listening", "answered", "summary"],
        description: "listening=聞き取り中 / answered=学校の情報で答えて解決した / summary=まとめを出した",
      },
      summary: {
        type: ["object", "null"],
        description: "status が summary のときだけ入れる。それ以外は null",
        properties: {
          grade: { type: "string" },
          category: { type: "string" },
          urgency: { type: "string", enum: ["高", "中", "低"] },
          summary: { type: "string" },
          request: { type: "string" },
        },
        required: ["grade", "category", "urgency", "summary", "request"],
      },
    },
    required: ["reply", "choices", "status", "summary"],
  };

  function AIへの指示() {
    return `あなたは「${設定.窓口の名前}」です。${設定.学校の名前}が用意した、保護者からの質問や相談を受け付ける AI の窓口です。
目的は、保護者の話をきちんと受け止めて先生に届けながら、先生の負担を減らすことです。
最初のあいさつ（「${設定.あいさつ.replace(/\n/g, " ")}」）は、すでに画面に出ています。

# 役割
1. 簡単な質問への回答
   - 下の「学校の情報」に答えがある質問には、その情報だけを使って答え、status を "answered" にする
   - 情報にないことは推測で答えない。「先生にお伝えしますね」と伝え、相談として聞き取りに切り替える
2. 相談の聞き取り
   - 判断や対応が必要な相談（友だち関係・いじめ・先生の対応・成績・体調など）は、先生に伝える情報を集める
   - 集める情報: お子さんの学年 / いつごろから / 何があったか / お子さんの様子 / 学校にしてほしいこと
   - 質問は 1 回に 1 つだけ。保護者がすでに話したことは聞き直さない
   - status は "listening"
3. まとめ
   - 必要な情報がそろったら、先生向けのまとめを summary に入れ、status を "summary" にする
   - reply では「先生向けにまとめました。内容に間違いがないか、ご確認ください。」のように伝える
   - 保護者が直したいと言ったら、どこを直すか聞き、直したまとめを出し直す

# 話し方
- やさしく丁寧な敬語で、1 回の返事は短く（3 文まで）
- 話を受け止める一言を添える（毎回でなくてよい）
- 否定しない。決めつけない。保護者・先生・子どもを評価しない
- 学校を代表して謝ったり、約束したりしない（「必ず〜します」「〜させます」と言わない）。対応を決めるのは先生
- けが・暴力・自分を傷つける・家に帰らないなど、命や安全に関わる内容は緊急度を「高」にし、「今すぐ危険があるときは、学校へお電話いただくか、110番・119番へ」と案内する
- 学校と関係のない話題は、やんわり断って学校の話に戻す
- 相手は中学生の保護者

# 選択肢（choices）
- 答えの形が決まっている質問（学年・時期・学校への希望など）では、2〜6 個の候補を入れる
- 学年の候補は 中1・中2・中3
- 自由に話してほしい質問では空にする

# まとめ（summary）
- grade: 例「中学2年」
- category: 例「友だち関係（いじめの心配）」「学習・宿題」「行事」「先生の対応」
- urgency: 高＝安全・いじめ・登校できないなど早い対応が必要 / 中＝数日以内に対応がほしい / 低＝急がない意見や要望
- summary: 先生が 30 秒で読めるよう、事実を 2〜3 文で。感情的な言葉は事実に言いかえる
- request: 保護者が学校に望むこと
- status が "summary" 以外のときは null

# 学校の情報
${学校の情報.trim()}`;
  }

  let 履歴 = [];   // AI に渡す、これまでのやり取り
  let 待ち中 = false;

  const 文の一手 = (type, text) => ({ type, content: [{ type: "text", text }] });

  async function AIに聞く() {
    let res;
    try {
      res = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": 鍵.読む() },
        body: JSON.stringify({
          model: 設定.モデル,
          system_instruction: AIへの指示(),
          input: 履歴,
          store: false,
          generation_config: { thinking_level: "low" },
          response_format: { type: "text", mime_type: "application/json", schema: 返事の形 },
        }),
      });
    } catch {
      throw new Error("インターネットにつながっていないようです。接続を確かめて、もう一度送ってください。");
    }

    let data = await res.json().catch(() => null);
    if (Array.isArray(data)) data = data[0];
    if (!res.ok || data?.error) throw new Error(エラーの説明(res.status, data?.error));

    // 返事の文字は steps の中の model_output にある（古い形の outputs にも対応）
    const 部品 = (data.steps || [])
      .filter((s) => s.type === "model_output")
      .flatMap((s) => s.content || [])
      .concat(data.steps ? [] : data.outputs || []);
    const text = 部品.filter((c) => c.type === "text").map((c) => c.text).join("");
    try {
      return { text, 返事: JSON.parse(text) };
    } catch {
      throw new Error("AI の返事をうまく読み取れませんでした。もう一度送ってください。");
    }
  }

  function エラーの説明(status, error) {
    const 理由 = error?.details?.find((d) => d.reason)?.reason;
    // 原因を調べられるよう、Google から返ってきた中身も添える
    const 詳しく = `\n\n詳しい内容: ${[status, error?.status, 理由, error?.message].filter(Boolean).join(" / ")}`;
    if (理由 === "API_KEY_INVALID") return "API キーが正しくないようです。左下の「API キーを変える」から入れ直してください。" + 詳しく;
    if (status === 429) return "AI の利用回数の上限に達しました。1 分ほど待ってから、もう一度送ってください。" + 詳しく;
    if (status === 403) return "この API キーでは AI を使えないようです。Google AI Studio でキーの設定を確かめてください。" + 詳しく;
    if (status === 404) return `AI のモデル「${設定.モデル}」が見つかりません。設定の「モデル」を確かめてください。` + 詳しく;
    if (status >= 500) return "AI の側で一時的なエラーが起きました。少し待ってから、もう一度送ってください。" + 詳しく;
    return `AI からエラーが返ってきました。もう一度送ってください。` + 詳しく;
  }

  async function 送る(text) {
    text = text.trim();
    if (!text || 待ち中) return;
    if (!鍵.読む()) { 鍵のカード(); return; }

    // 選択肢・まとめのボタンは、次の発言をしたら使えなくする
    chat.querySelectorAll(".chips:not(.done)").forEach((c) => c.classList.add("done"));
    chat.querySelectorAll(".card-actions").forEach((a) => a.remove());

    const 発言 = 保護者の発言(text);
    履歴.push(文の一手("user_input", text));
    待ち中 = true;
    const 入力中 = 入力中の表示();

    try {
      const { text: 生の返事, 返事 } = await AIに聞く();
      入力中.remove();
      履歴.push(文の一手("model_output", 生の返事));

      if (返事.status === "summary" && 返事.summary) {
        AIの発言(返事.reply);
        まとめのカード(返事.summary);
      } else {
        AIの発言(返事.reply, 返事.choices);
        if (返事.status === "answered") お知らせ(設定.回答済みのお知らせ);
      }
    } catch (e) {
      // 失敗した発言は取り消して、入力欄に戻す（もう一度送れるように）
      入力中.remove();
      履歴.pop();
      発言.remove();
      input.value = text;
      入力欄の高さ();
      お知らせ(e.message, true);
    } finally {
      待ち中 = false;
    }
  }

  function まとめを送った(まとめ) {
    const 緊急 = まとめ.urgency === "高";
    お知らせ(緊急 ? 設定.届け先_緊急 : 設定.届け先_ふつう);
    const 返事 = (緊急 ? 設定.送ったあとの返事_緊急 : 設定.送ったあとの返事_ふつう)
      + (緊急 ? "\n\n" + 設定.緊急のときの案内 : "");
    AIの発言(返事);
    // 送ったことを AI にも伝えておく（このあと会話が続いたとき用）
    履歴.push(文の一手("user_input", "（まとめを確認し、この内容で先生に送りました）"));
    履歴.push(文の一手("model_output", JSON.stringify({ reply: 返事, choices: [], status: "listening", summary: null })));
  }

  function 会話を始める() {
    履歴 = [];
    待ち中 = false;
    chat.innerHTML = "";
    chat.append(el("div", "date-chip", 今日()));
    if (!鍵.読む()) { 鍵のカード(); return; }
    AIの発言(設定.あいさつ);
    input.focus();
  }

  // ---- 入力欄 ----

  function 入力欄の高さ() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + 2 + "px";
  }
  input.addEventListener("input", 入力欄の高さ);
  input.addEventListener("keydown", (e) => {
    // 日本語の変換中の Enter は送らない
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });
  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    if (待ち中 || !input.value.trim()) return;
    const text = input.value;
    input.value = "";
    入力欄の高さ();
    送る(text);
  });

  // ---- 操作パネル ----

  document.getElementById("restart").addEventListener("click", 会話を始める);
  document.getElementById("changeKey").addEventListener("click", () => {
    鍵.書く("");
    会話を始める();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") panel.classList.toggle("hidden");
  });

  鍵の状態を表示();
  会話を始める();

  // 文字の読み込みや、全画面への切り替えで大きさが変わったら表示位置を合わせ直す
  document.fonts?.ready.then(() => 下まで送る(false));
  new ResizeObserver(() => 下まで送る(false)).observe(chat);
})();
</script>
</body>
</html>
